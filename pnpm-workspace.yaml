packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
# Temporary: keep pnpm's manager metadata out of the lockfile until GitHub supports its multi-document format.
pmOnFail: ignore
overrides:
  # Keep esbuild patched until drizzle-kit drops its deprecated loader: https://github.com/drizzle-team/drizzle-orm/issues/5145
  esbuild: '>=0.25.0'
