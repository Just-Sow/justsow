packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
# Temporary: keep pnpm's manager metadata out of the lockfile until GitHub supports its multi-document format.
pmOnFail: ignore
overrides:
  # Keep esbuild patched until drizzle-kit drops its deprecated loader: https://github.com/drizzle-team/drizzle-orm/issues/5145
  esbuild: '>=0.25.0'
minimumReleaseAgeExclude:
  - '@sanity/access-ui@6.16.0'
  - '@sanity/diff@6.16.0'
  - '@sanity/mutator@6.16.0'
  - '@sanity/schema@6.16.0'
  - '@sanity/types@6.16.0'
  - '@sanity/ui@4.2.3'
  - '@sanity/util@6.16.0'
  - '@sanity/validation@6.16.0'
  - '@sanity/vision@6.16.0'
  - sanity@6.16.0
